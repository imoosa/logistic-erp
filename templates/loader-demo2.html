<!DOCTYPE html>
<html>
<head>
<style>
  body { background:#F8FAFC; height:100vh; margin:0; }

  .logo-loader-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }

  .logo-loader {
    width: 90px; height: 90px; border-radius: 50%;
    background: #F5B711;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }
  .logo-loader .bar {
    width: 9px; border-radius: 5px; background: #fff;
    animation: bar-pulse 1.1s ease-in-out infinite;
  }
  .logo-loader .bar:nth-child(1) { height: 22px; animation-delay: 0s; }
  .logo-loader .bar:nth-child(2) { height: 34px; animation-delay: 0.12s; }
  .logo-loader .bar:nth-child(3) { height: 46px; animation-delay: 0.24s; }
  .logo-loader .bar:nth-child(4) { height: 30px; animation-delay: 0.36s; }

  @keyframes bar-pulse {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
</style>
</head>
<body>

  <div class="logo-loader-overlay" id="logoLoaderOverlay">
    <div class="logo-loader">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

</body>
</html>
